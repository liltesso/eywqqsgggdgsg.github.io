<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gifts Rental & Sale — Merchant Partners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rent.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
    <!--
      Configure before rent.js loads:
        window.BACKEND_URL — your FastAPI backend origin
      Defaults below are safe to edit.
    -->
    <script>
        window.BACKEND_URL = window.BACKEND_URL || '';
        window.TONCONNECT_MANIFEST = 'https://eywqqsgggdgsg.github.io/tonconnect-manifest.json';
    </script>
</head>
<body>
    <div id="app">

        <header class="r-header">
            <div class="r-header-inner">
                <h1 class="r-title">Gifts <span class="accent">Market</span></h1>
                <div id="ton-connect" class="ton-connect-slot"></div>
            </div>

            <!-- Mode tabs -->
            <div class="r-tabs" role="tablist">
                <button class="r-tab active" data-mode="rent" role="tab">Оренда</button>
                <button class="r-tab" data-mode="sale" role="tab">Продаж</button>
            </div>

            <!-- Sort filters -->
            <div class="r-filters" id="filters-bar" role="tablist">
                <button class="filter-chip active" data-sort="popular" role="tab">Популярні</button>
                <button class="filter-chip" data-sort="price_asc" role="tab">Дешевші</button>
                <button class="filter-chip" data-sort="price_desc" role="tab">Дорожчі</button>
                <button class="filter-chip rent-only" data-sort="duration" role="tab">Довший термін</button>
            </div>
        </header>

        <main class="r-grid" id="gifts-grid" aria-live="polite">
            <div class="gift-skeleton"></div><div class="gift-skeleton"></div>
            <div class="gift-skeleton"></div><div class="gift-skeleton"></div>
            <div class="gift-skeleton"></div><div class="gift-skeleton"></div>
        </main>

        <div class="r-load-more" id="load-more-container" style="display:none">
            <button class="load-more-btn" id="load-more-btn">Завантажити ще</button>
        </div>
    </div>

    <!-- Bottom Sheet -->
    <div class="modal-overlay" id="rental-modal" style="display:none" role="dialog" aria-modal="true">
        <div class="modal-sheet" id="modal-sheet">
            <div class="modal-drag-handle"></div>

            <div class="modal-gift-preview">
                <div class="modal-img-wrap">
                    <img class="modal-gift-img" id="modal-img" src="" alt="" loading="lazy">
                </div>
                <div class="modal-gift-info">
                    <h2 class="modal-gift-name" id="modal-name"></h2>
                    <div class="modal-gift-addr" id="modal-addr"></div>
                    <div class="modal-ppd" id="modal-ppd-wrap">
                        <span class="modal-ppd-stars" id="modal-ppd-stars"></span>
                        <span class="modal-ppd-label" id="modal-ppd-label">/ день</span>
                    </div>
                </div>
            </div>

            <div class="modal-divider"></div>

            <!-- Duration (rent only) -->
            <div class="duration-section" id="duration-section">
                <div class="duration-header">
                    <span class="duration-label">Термін оренди</span>
                    <span class="duration-value" id="duration-display">7 днів</span>
                </div>
                <div class="slider-track-wrap">
                    <input type="range" class="duration-slider" id="duration-slider" min="1" max="30" value="7" aria-label="Термін оренди в днях">
                </div>
                <div class="duration-range-labels">
                    <span id="duration-min-label">1 день</span>
                    <span id="duration-max-label">30 днів</span>
                </div>
            </div>

            <div class="total-section">
                <div class="total-row">
                    <span class="total-label">Разом</span>
                    <div class="total-amount-col">
                        <span class="total-stars" id="total-ton"></span>
                        <span class="total-ton" id="total-stars"></span>
                    </div>
                </div>
                <div class="discount-row" id="discount-row" style="display:none">
                    <span class="discount-text" id="discount-text"></span>
                </div>
            </div>

            <!-- Payment method -->
            <div class="method-toggle" id="method-toggle">
                <button class="method-btn active" data-method="tonconnect">
                    <span class="method-ic">💎</span> TON (гаманець)
                </button>
                <button class="method-btn" data-method="stars">
                    <span class="method-ic">⭐</span> Telegram Stars
                </button>
            </div>

            <button class="rent-btn" id="rent-btn">
                <span id="rent-btn-text">Орендувати</span>
            </button>

            <p class="modal-disclaimer" id="modal-disclaimer">
                Оплата TON-гаманцем: подарунок одразу зараховується на ваш акаунт.
                Повернення оренди — автоматично після закінчення терміну.
            </p>
        </div>
    </div>

    <!-- Success -->
    <div class="success-overlay" id="success-screen" style="display:none">
        <div class="success-content">
            <div class="success-anim">
                <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
                    <circle cx="36" cy="36" r="36" fill="rgba(212,17,21,0.12)"/>
                    <circle cx="36" cy="36" r="26" fill="rgba(212,17,21,0.2)"/>
                    <path d="M23 36l9 9 17-18" stroke="#d41115" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h2 class="success-title" id="success-title">Готово!</h2>
            <p class="success-desc" id="success-desc"></p>
            <button class="success-btn" id="success-btn">Чудово!</button>
        </div>
    </div>

    <script src="rent.js"></script>
</body>
</html>
