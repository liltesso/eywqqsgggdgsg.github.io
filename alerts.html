<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#060608">
    <title>Тривоги — Asset Market</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rent.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        window.BACKEND_URL = window.BACKEND_URL || 'https://robin-jeep-pantomime.ngrok-free.dev';
    </script>
</head>
<body data-tab="alerts">

<!-- ══════════════════ AMBIENT BACKGROUND ══════════════════ -->
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="glow-spot spot-1" aria-hidden="true"></div>
<div class="glow-spot spot-2" aria-hidden="true"></div>

<!-- ══════════════════ ALERTS / MAP ══════════════════ -->
<section class="view" data-view="alerts">

    <header class="alerts-hdr" id="alerts-header">
        <div class="alerts-status-banner" id="alerts-status">
            <div class="status-dot" id="status-dot"></div>
            <div class="status-text">
                <div class="status-title" id="alerts-status-title">Тихо</div>
                <div class="status-sub"   id="alerts-status-sub">Активних загроз не зафіксовано</div>
            </div>
            <button class="icon-btn" id="alerts-refresh-btn" aria-label="Оновити">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 019-9 9 9 0 016.4 2.6L21 8"/><path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 01-9 9 9 9 0 01-6.4-2.6L3 16"/><path d="M3 21v-5h5"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="alerts-body">

        <!-- MAP -->
        <div class="map-container" id="map-container">
            <div class="map-bg-glow"></div>

            <svg id="alerts-map" class="alerts-map" viewBox="0 0 1000 660"
                 preserveAspectRatio="xMidYMid meet" role="img" aria-label="Карта повітряних тривог України">
                <defs>
                    <!-- Threat glow -->
                    <radialGradient id="tGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%"   stop-color="#ff2a2e" stop-opacity="0.9"/>
                        <stop offset="100%" stop-color="#ff2a2e" stop-opacity="0"/>
                    </radialGradient>
                    <!-- Ukraine fill gradient -->
                    <linearGradient id="uaFill" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%"   stop-color="#1c2a46" stop-opacity="0.72"/>
                        <stop offset="50%"  stop-color="#162038" stop-opacity="0.60"/>
                        <stop offset="100%" stop-color="#0e1520" stop-opacity="0.52"/>
                    </linearGradient>
                    <!-- Water fill gradient -->
                    <linearGradient id="waterFill" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%"   stop-color="#091828" stop-opacity="0.88"/>
                        <stop offset="100%" stop-color="#060e1c" stop-opacity="0.78"/>
                    </linearGradient>
                    <!-- Border glow filter -->
                    <filter id="borderGlow" x="-5%" y="-5%" width="110%" height="110%">
                        <feGaussianBlur stdDeviation="2.5" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <!-- PNG map → dark navy filter
                         White bg (V=1.0) → #000 (clamped, invisible)
                         Light grey fill (V≈0.85) → #112038 navy
                         Border grey (V≈0.72) → #2e508a blue line -->
                    <filter id="mapImgFilter" color-interpolation-filters="sRGB"
                            x="0%" y="0%" width="100%" height="100%">
                        <feColorMatrix type="matrix" values="
                            -0.88  0  0  0  0.815
                            -1.44  0  0  0  1.340
                            -2.48  0  0  0  2.341
                             0     0  0  1  0"/>
                    </filter>
                    <!-- Alert-glow for oblast image overlay -->
                    <filter id="oblaGlow" x="-10%" y="-10%" width="120%" height="120%">
                        <feGaussianBlur stdDeviation="6" result="b"/>
                        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <!-- Threat drop-shadow -->
                    <filter id="threatShadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff2a2e" flood-opacity="0.8"/>
                    </filter>
                    <!-- Ukraine clip — precise L-command outline (1991 borders, 66 anchor points) -->
                    <clipPath id="uaClip">
                        <path d="M 113,162 L 128,106 L 159,92 L 203,82 L 242,92 L 284,95
                                 L 328,88 L 382,73 L 435,70 L 491,87 L 550,87 L 602,85
                                 L 640,106 L 662,112 L 689,125 L 728,129 L 748,153 L 819,187
                                 L 877,238 L 908,288 L 954,335 L 963,380 L 969,398 L 958,414
                                 L 889,419 L 820,421 L 799,445 L 711,526 L 794,561 L 782,564
                                 L 739,557 L 708,608 L 663,616 L 658,621 L 635,644 L 610,630
                                 L 564,557 L 569,551 L 625,495 L 685,512 L 689,491 L 582,462
                                 L 539,457 L 505,471 L 476,481 L 449,512 L 417,544 L 390,547
                                 L 367,544 L 352,540 L 335,546 L 329,563 L 286,549 L 247,511
                                 L 204,486 L 154,469 L 102,486 L 77,481 L 43,380 L 35,349
                                 L 30,318 L 32,294 L 35,266 L 46,207 L 83,170 L 113,162 Z"/>
                    </clipPath>
                    <!-- Inner relief shading -->
                    <radialGradient id="uaRelief" cx="46%" cy="40%" r="64%">
                        <stop offset="0%"   stop-color="#2a3f66" stop-opacity="0.55"/>
                        <stop offset="55%"  stop-color="#172741" stop-opacity="0.28"/>
                        <stop offset="100%" stop-color="#0a111d" stop-opacity="0"/>
                    </radialGradient>
                    <!-- Coast drop-shadow into the sea -->
                    <filter id="coastShadow" x="-12%" y="-12%" width="124%" height="124%">
                        <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#00060f" flood-opacity="0.7"/>
                    </filter>
                    <!-- Subtle graticule inside UA -->
                    <pattern id="ua-grid" x="0" y="0" width="46" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 46 0 L 0 0 0 40" fill="none" stroke="rgba(150,180,230,0.04)" stroke-width="0.6"/>
                    </pattern>
                </defs>

                <rect width="1000" height="660" fill="#040912"/>

                         L 30,318 L 32,294 L 35,266 L 46,207 L 83,170 L 113,162 Z"
                      fill="url(#uaFill)"/>

                     preserveAspectRatio="none" fills SVG exactly (minor horizontal compression ~15% accepted). -->

                       preserveAspectRatio="none"
                       filter="url(#mapImgFilter)"
                       clip-path="url(#uaClip)"

                    <polygon points="15,0 6,3 10,0 6,-3"     fill="rgba(215,232,255,0.22)"/>
                    <text x="0" y="-22" text-anchor="middle" fill="rgba(195,215,255,0.65)"
                          font-size="7" font-family="sans-serif" font-weight="800" letter-spacing="0.5">N</text>
                </g>

                <!-- Cities and threats (populated via JS) -->
                <g id="map-cities"></g>
                <g id="map-threats"></g>
            </svg>

            <!-- Map overlay controls -->
            <div class="map-legend">
                <span><i class="ldot red"></i><span>Загроза</span></span>
                <span><i class="ldot blue"></i><span>Місто</span></span>
                <span><i class="ldot river"></i><span>Дніпро</span></span>
            </div>
            <!-- Zoom controls -->
            <div class="map-zoom-btns" role="group" aria-label="Масштаб карти">
                <button class="map-zoom-btn" id="map-zoom-in"  aria-label="Збільшити">+</button>
                <button class="map-zoom-btn" id="map-zoom-out" aria-label="Зменшити">−</button>
            </div>
            <button class="map-zoom-reset" id="map-zoom-reset" title="Скинути вид">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                    <path d="M3 12a9 9 0 019-9 9 9 0 016.4 2.6L21 8"/><path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 01-9 9 9 9 0 01-6.4-2.6L3 16"/><path d="M3 21v-5h5"/>
                </svg>
            </button>
            <div class="map-zoom-hint">Drag / Pinch / ± для зуму</div>

            <!-- Threat detail popup -->
            <div class="threat-popup" id="threat-popup" hidden>
                <button class="threat-popup-close" id="threat-popup-close">×</button>
                <div class="threat-popup-icon"    id="threat-popup-icon"></div>
                <div class="threat-popup-content">
                    <div class="threat-popup-name"  id="threat-popup-name"></div>
                    <div class="threat-popup-route" id="threat-popup-route"></div>
                    <div class="threat-popup-tags"  id="threat-popup-tags"></div>
                </div>
            </div>
        </div>

        <!-- STATS STRIP -->
        <div class="alerts-stats" id="alerts-stats">
            <div class="stat-card skeleton-stat"></div>
            <div class="stat-card skeleton-stat"></div>
            <div class="stat-card skeleton-stat"></div>
            <div class="stat-card skeleton-stat"></div>
        </div>

        <!-- ACTIVE THREATS -->
        <div class="alerts-section">
            <div class="section-hdr">
                <span class="section-title">Активні загрози</span>
                <span class="count-chip" id="alerts-count-badge">0</span>
            </div>
            <div class="threats-list" id="alerts-threats-list">
                <div class="threat-skeleton"></div>
                <div class="threat-skeleton"></div>
            </div>
        </div>

        <!-- RECENT ATTACKS -->
        <div class="alerts-section">
            <div class="section-hdr">
                <span class="section-title">Останні атаки</span>
            </div>
            <div class="attacks-list" id="alerts-attacks-list">
                <div class="attack-skeleton"></div>
                <div class="attack-skeleton"></div>
            </div>
        </div>

    </main>
</section>
